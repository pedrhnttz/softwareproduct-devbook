<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar publicação | DevBook</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>
    <header>
        <nav class="container">
            <a href="{{ url_for('home') }}" class="logo-link">
                <div class="logo">DevBook</div>
            </a>
            <div class="nav-auth">
                <a href="{{ url_for('profile') }}" class="btn-profile nav-user">
                    <img class="nav-avatar" src="{{ current_user | user_avatar_url }}" width="32" height="32" alt="">
                    <span>{{ current_user.name }}</span>
                </a>
            </div>
        </nav>
    </header>

    <main>
        <section class="feed-section container">
            <article class="composer card edit-post-card">
                <h2>Editar publicação</h2>
                <form class="composer-form" method="post" action="{{ url_for('edit_post', post_id=post.id) }}">
                    <label for="body" class="sr-only">Conteúdo da publicação</label>
                    <textarea
                        id="body"
                        name="body"
                        rows="6"
                        maxlength="2000"
                        required
                    >{{ post.body }}</textarea>
                    <div class="composer-actions composer-actions-split">
                        <a href="{{ url_for('home') }}" class="btn-secondary">Cancelar</a>
                        <button type="submit" class="btn-primary">Salvar</button>
                    </div>
                </form>
            </article>
        </section>
    </main>
</body>
</html>
